<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#10161d">
<meta name="description" content="โปรไฟล์นักเรียนคู่ Grape และ Pang โรงเรียนทุ่งใหญ่เฉลิมราชานุสรณ์ รัชมังคลาภิเษก">
<title>โปรไฟล์ — เกรฟ &amp; แป้ง</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Noto+Serif+Thai:wght@400&family=IBM+Plex+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;
  --ink:#f4f2ee;--mute:rgba(244,242,238,.74);--line:rgba(255,255,255,.15);--gold:#dcc9a6;
  --serif:"Playfair Display","Noto Serif Thai",Georgia,serif;--sans:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:var(--sans);font-weight:300;color:var(--ink);background:#10161d;overflow-x:hidden;line-height:1.7}
body::before{content:"";pointer-events:none;position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:20;background:rgba(14,19,26,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bg{pointer-events:none;position:fixed;inset:-80px;z-index:0;background:center/cover no-repeat;filter:blur(42px) saturate(1.35) brightness(.55);transform:scale(1.1);transition:opacity .5s}
.veil{pointer-events:none;position:fixed;inset:0;z-index:0;background:linear-gradient(rgba(10,15,21,.3),rgba(10,15,21,.62))}
.col{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:12px 0 48px}

.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:10;margin:0 14px;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;
  background:rgba(255,255,255,.09);backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);
  border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 30px rgba(0,0,0,.25)}
.pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:#f1eee8;box-shadow:0 2px 10px rgba(0,0,0,.28);transition:transform .38s cubic-bezier(.3,.8,.3,1)}
.tabs button{all:unset;touch-action:manipulation;-webkit-tap-highlight-color:transparent;position:relative;z-index:1;cursor:pointer;text-align:center;padding:9px 4px 10px;border-radius:10px;line-height:1.3;transition:color .3s}
.tabs button b{display:block;font-family:var(--serif);font-weight:500;font-size:1.08rem;letter-spacing:.02em}
.tabs button small{display:block;font-size:.68rem;margin-top:1px;opacity:.75}
.tabs button[aria-selected=false]{color:var(--mute)}
.tabs button[aria-selected=true]{color:#1a2028}
.tabs button:focus-visible{outline:2px solid #fff;outline-offset:1px}

#view{animation:up .4s ease}
@keyframes up{from{transform:translateY(10px)}to{transform:none}}
.ph{margin:14px 14px 0;border-radius:30px;overflow:hidden;aspect-ratio:4/5;background:#222;box-shadow:0 22px 50px rgba(0,0,0,.4)}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.card{margin:14px;padding:20px 20px 18px;border-radius:26px;
  background:linear-gradient(140deg,rgba(255,255,255,.17),rgba(255,255,255,.05) 55%,rgba(255,255,255,.1));
  backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);
  border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(255,255,255,.07),0 18px 40px rgba(0,0,0,.25)}
.name{margin-top:-62px;position:relative;text-align:center;padding-top:24px}
.name h1{margin:0;font-family:var(--serif);font-weight:500;font-size:2.7rem;line-height:1.1;letter-spacing:.01em}
.name .th{margin:8px 0 0;font-size:1rem;font-weight:400}
.name .meta{margin:2px 0 0;font-size:.84rem;color:var(--mute)}
.st{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.st div+div{border-left:1px solid var(--line)}
.st b{display:block;font-weight:400;font-size:1.05rem;line-height:1.4}
.st small{font-size:.72rem;color:var(--mute);line-height:1.4;display:block}
.card h2{margin:0 0 6px;font-size:.8rem;font-weight:500;color:var(--mute)}
.r{display:grid;grid-template-columns:6.6rem 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:.92rem}
.r:first-of-type{border-top:0}
.r small{font-size:.82rem;color:var(--mute);padding-top:1px}
.it{padding:14px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0;padding-top:8px}
.it b{display:block;font-weight:500;font-size:.96rem;line-height:1.5}
.it p{margin:3px 0 0;font-size:.85rem;line-height:1.7;color:var(--mute)}
.it em{display:inline-block;margin-top:9px;font-style:normal;font-size:.74rem;padding:2px 11px 3px;border-radius:99px;border:1px solid rgba(220,201,166,.55);color:var(--gold)}
.tx{margin:0;font-size:.92rem;line-height:1.85}
.ls{list-style:none;margin:0;padding:0}
.ls li{position:relative;padding:8px 0 8px 18px;font-size:.92rem;line-height:1.65;border-top:1px solid var(--line)}
.ls li:first-child{border-top:0}
.ls li::before{content:"";position:absolute;left:2px;top:1.15em;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.q{text-align:center;padding:26px 22px}
.q p{margin:0;font-family:var(--serif);font-weight:400;font-size:1.2rem;line-height:1.75}
.q small{display:block;margin-top:12px;font-size:.84rem;color:var(--mute);line-height:1.7}
.q::before{content:"";display:block;width:34px;height:1px;background:var(--gold);margin:0 auto 18px}
.next{all:unset;cursor:pointer;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;width:calc(100% - 28px);margin:14px;padding:17px 20px;border-radius:26px;font-size:.95rem;font-weight:400;
  background:linear-gradient(140deg,rgba(255,255,255,.17),rgba(255,255,255,.05));backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 18px 40px rgba(0,0,0,.25)}
.next:focus-visible{outline:2px solid #fff;outline-offset:2px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,.next,.tabs{background:rgba(30,36,44,.86)}}
@media print{body{background:#fff;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}.bg,.veil,.tabs,.next,body::before{display:none}.col{max-width:none;padding:0}
.card{background:#fff;color:#111;border:1px solid #ccc;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;break-inside:avoid;margin:10px 0}
.ph{box-shadow:none;max-width:420px;margin:0 auto}.name{margin-top:10px}.card h2,.r small,.it p,.st small,.name .meta,.q small{color:#444}
.r,.it,.ls li,.st,.st div+div{border-color:#ddd}.it em{color:#6b5a3a;border-color:#9a8660}.ls li::before{background:#6b5a3a}}
@media(prefers-reduced-motion:reduce){#view{animation:none}.pill{transition:none}}
</style>
</head>

<div class="bg" id="bg" aria-hidden="true"></div><div class="veil" aria-hidden="true"></div>
<div class="col">
  <nav class="tabs" id="tabs" role="tablist" aria-label="เลือกโปรไฟล์"><span class="pill" id="pill"></span></nav>
  <main id="view" role="tabpanel"></main>
</div>

/* ============================ */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tabs=document.getElementById("tabs"),view=document.getElementById("view"),pill=document.getElementById("pill"),bg=document.getElementById("bg");
const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
tabs.insertAdjacentHTML("beforeend",D.map((p,i)=>`<button type="button" role="tab" id="t${i}" aria-controls="view" data-i="${i}"><b>${esc(p.tab)}</b><small>${esc(p.th)}</small></button>`).join(""));
const body={
 rows:r=>r.map(x=>`<div class="r"><small>${esc(x[0])}</small><span>${esc(x[1])}</span></div>`).join(""),
 text:t=>`<p class="tx">${esc(t)}</p>`,
 list:l=>`<ul class="ls">${l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`,
 items:a=>a.map(x=>`<div class="it"><b>${esc(x[0])}</b><p>${esc(x[1])}</p>${x[2]?`<em>${esc(x[2])}</em>`:""}</div>`).join("")};

let cur=-1;
function show(i,scroll){cur=i;
  const p=D[i],o=D[1-i];
  bg.style.backgroundImage=`url("${p.img}")`;
  view.style.animation="none";view.offsetHeight;view.style.animation="";
  view.innerHTML=`
  <div class="ph"><img src="${p.img}" alt="รูปของ${esc(p.tab)}" style="object-position:${p.pos}"></div>
  <section class="card name"><h1>${esc(p.en)}</h1><p class="th">${esc(p.th)}</p><p class="meta">${esc(p.meta)}</p>
    <div class="st">${p.stats.map(s=>`<div><b>${esc(s[0])}</b><small>${esc(s[1])}</small></div>`).join("")}</div></section>
  ${p.secs.map(s=>`<section class="card"><h2>${esc(s[0])}</h2>${body[s[1]](s[2])}</section>`).join("")}
  <section class="card q"><p>${esc(p.q)}</p>${p.qs?`<small>${esc(p.qs)}</small>`:""}</section>
  <button type="button" class="next" data-i="${1-i}"><span>ดูโปรไฟล์ของ${esc(o.tab)}</span><span>›</span></button>`;
  tabs.querySelectorAll("button").forEach((b,k)=>{b.setAttribute("aria-selected",k===i);b.tabIndex=k===i?0:-1});
  view.setAttribute("aria-labelledby","t"+i);
  pill.style.transform=`translateX(${i*100}%)`;
  document.title="โปรไฟล์ — "+p.tab;
  if(scroll)scrollTo({top:0,behavior:rm?"auto":"smooth"});
}
function go(i){show(i,true);try{history.replaceState(null,"","#"+D[i].id)}catch(_){try{location.hash=D[i].id}catch(_){}}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(b)go(+b.dataset.i)});
addEventListener("hashchange",()=>{const k=D.findIndex(p=>"#"+p.id===location.hash);if(k>=0&&k!==cur)show(k,true)});
tabs.addEventListener("keydown",e=>{if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;const n=cur+(e.key==="ArrowRight"?1:-1);if(n>=0&&n<D.length){e.preventDefault();go(n);tabs.querySelectorAll("button")[n].focus()}});
let sx=0,sy=0;
addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener("touchend",e=>{const c=e.changedTouches[0],dx=c.clientX-sx,dy=c.clientY-sy;if(Math.abs(dx)>80&&Math.abs(dy)<45){const n=cur+(dx<0?1:-1);if(n>=0&&n<D.length)go(n)}},{passive:true});
let h="";try{h=location.hash}catch(_){}
const s=D.findIndex(p=>"#"+p.id===h);show(s<0?0:s,false);
</script>
</body>
